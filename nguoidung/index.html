<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vietnam Voyage AI - Tuyệt Tác Du Lịch Việt Nam</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
    
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(5deg); }
    }
    .animate-float { animation: floatParticle 6s ease-in-out infinite; }

    .shimmer-bg {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmerMove 3.5s infinite;
    }
    @keyframes shimmerMove {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>

  <!-- Nạp riêng dữ liệu 3 miền -->
  <script src="./mienBac.js"></script>
  <script src="./mienTrung.js"></script>
  <script src="./mienNam.js"></script>

  <!-- Nạp giao diện React App.jsx -->
  <script type="text/babel" src="./App.jsx"></script>
</head>
<body class="bg-[#faf9f6] text-stone-800 antialiased selection:bg-rose-500 selection:text-white overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    if (window.VietnamTravelApp) {
      ReactDOM.createRoot(document.getElementById("root")).render(<window.VietnamTravelApp />);
    }
  </script>
</body>
</html>
